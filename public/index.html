<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My UV Proxy</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0f1219; color: #e8ecf1; margin: 0; display: flex; flex-direction: column; align-items: center; }
      h1 { margin-top: 3rem; }
      form { display: flex; gap: .5rem; width: min(680px, 90vw); }
      input { flex: 1; padding: .8rem 1rem; border-radius: 8px; border: 1px solid #2a3242; background: #171c26; color: #e8ecf1; }
      button { padding: .8rem 1.2rem; border-radius: 8px; border: 0; background: #4f7cff; color: white; cursor: pointer; }
      #uv-error { color: #ff7b72; }
      #uv-frame { display: none; width: min(1100px, 96vw); height: 78vh; border: 1px solid #2a3242; border-radius: 8px; background: white; margin-bottom: 2rem; }
    </style>
    <!-- ベンダースクリプト (サーバーの /uv/, /baremux/, /epoxy/ から配信) -->
    <script src="/baremux/index.js" defer></script>
    <script src="/epoxy/index.js" defer></script>
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <script src="/register-sw.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <h1>My UV Proxy</h1>
    <form id="uv-form">
      <input id="uv-address" type="text" placeholder="URL または検索語を入力" autocomplete="off" />
      <button type="submit">開く</button>
    </form>
    <p id="uv-error"></p>
    <pre id="uv-error-code"></pre>
    <iframe id="uv-frame" title="proxied content"></iframe>
  </body>
</html>
