services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8080
      # カンマ区切りの正規表現で中継許可ホストを指定 (空=無制限)
      # 例: WISP_WHITELIST=^example\.com$,^.*\.example\.net$
      - WISP_WHITELIST=${WISP_WHITELIST:-}
    expose: ["8080"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
